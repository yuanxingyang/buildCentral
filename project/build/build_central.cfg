                    "MACRO" : "PLATFORM_HIGH_LOCAL",
                    "GROUPS" : ["high-local"]
                },
                "dev-low-local" : {
                    "MACRO" : "PLATFORM_LOW_LOCAL",
                    "GROUPS" : ["low-local"]
                },
                "rel-high-local" : {
                    "MACRO" : "PLATFORM_LOW_LOCAL",
                    "GROUPS" : ["high-local", "high-image"]
                },
                "rel-low-local" : {
                    "MACRO" : "PLATFORM_HIGH_LOCAL",
                    "GROUPS" : ["low-local", "low-image"]
                }
            }
        },
        "windows" : {
